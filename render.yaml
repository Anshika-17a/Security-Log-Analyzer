# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# NOTE: this blueprint deliberately does NOT provision a database.
# Render's free plan allows only ONE free Postgres per account, so declaring one
# here fails the whole sync ("cannot have more than one active free tier
# database") if the account already has one.
#
# Storage options, in order of preference:
#
#   1. External free Postgres (Neon / Supabase) — recommended. Does not count
#      against Render's limit and does not expire. Add DATABASE_URL in the
#      Render dashboard: Service -> Environment -> Add Environment Variable.
#
#   2. An existing Render Postgres — copy its Internal Database URL from its
#      dashboard page and set DATABASE_URL the same way.
#
#   3. Nothing (default) — the app falls back to SQLite. Zero setup and the
#      dashboard is still populated via SEED_ON_START, but the file lives on an
#      ephemeral disk, so data resets on every redeploy and cold start.

services:
  - type: web
    name: security-log-analyzer
    runtime: python
    plan: free
    region: singapore          # closest to India; change if judging elsewhere
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Populates an empty database on first boot so the dashboard is never
      # empty. No-ops once logs exist, so restarts cost nothing.
      - key: SEED_ON_START
        value: "true"
      - key: SEED_FILE
        value: "data/sample_logs.csv"
      # Set these in the Render dashboard, never in this file:
      #   DATABASE_URL    - Postgres connection string (see note above)
      #   GEMINI_API_KEY  - enables the AI narrative endpoint
