# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.

databases:
  - name: security-log-analyzer-db
    plan: free
    databaseName: security_logs
    user: security_logs

services:
  - type: web
    name: security-log-analyzer
    runtime: python
    plan: free
    region: singapore          # closest to India; change if judging elsewhere
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Managed Postgres. Render injects the connection string; app/models/db.py
      # rewrites the postgres:// scheme to the psycopg v3 driver. Data now
      # survives redeploys and cold starts, unlike the ephemeral SQLite file.
      - key: DATABASE_URL
        fromDatabase:
          name: security-log-analyzer-db
          property: connectionString
      # Populates the database on first boot so the dashboard is never empty.
      # No-ops once logs exist, so it costs nothing on later restarts.
      - key: SEED_ON_START
        value: "true"
      - key: SEED_FILE
        value: "data/sample_logs.csv"
      # Optional: set in the Render dashboard (do NOT commit a real key)
      # - key: GEMINI_API_KEY
      #   sync: false
